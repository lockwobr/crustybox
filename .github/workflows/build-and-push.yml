name: Build and push

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - versions.env
      - .github/workflows/build-and-push.yml
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load pinned dependency versions
        id: versions
        run: cat versions.env >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=coreutils-${{ steps.versions.outputs.UUTILS_COREUTILS_VERSION }}-brush-${{ steps.versions.outputs.BRUSH_SHELL_VERSION }}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            UUTILS_COREUTILS_VERSION=${{ steps.versions.outputs.UUTILS_COREUTILS_VERSION }}
            BRUSH_SHELL_VERSION=${{ steps.versions.outputs.BRUSH_SHELL_VERSION }}
            PROCS_VERSION=${{ steps.versions.outputs.PROCS_VERSION }}
            BOTTOM_VERSION=${{ steps.versions.outputs.BOTTOM_VERSION }}
            OUCH_VERSION=${{ steps.versions.outputs.OUCH_VERSION }}
            DIFFUTILS_VERSION=${{ steps.versions.outputs.DIFFUTILS_VERSION }}
            FINDUTILS_VERSION=${{ steps.versions.outputs.FINDUTILS_VERSION }}
            SED_VERSION=${{ steps.versions.outputs.SED_VERSION }}
            GREP_VERSION=${{ steps.versions.outputs.GREP_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
